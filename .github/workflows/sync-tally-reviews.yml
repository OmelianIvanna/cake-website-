name: Sync Tally reviews

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch reviews from Tally
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
        run: node tools/sync-tally-reviews.mjs --include-all --debug

      - name: Commit updated reviews
        run: |
          if git diff --quiet data/approved-reviews.json; then
            echo "No review changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/approved-reviews.json
          git commit -m "Sync Tally reviews"
          git push
