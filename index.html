        <defs>
          <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="100%">

            <stop offset="28%" stop-color="#C96F89"></stop>
            <stop offset="55%" stop-color="#A94F69"></stop>
            <stop offset="78%" stop-color="#C66E88"></stop>
